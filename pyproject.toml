[project]
name = "programming-competition-creator"
version = "0.1.0"
description = "A tool to build Domjudge competitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiodocker>=0.24.0",
    "asyncio>=4.0.0",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "ruamel-yaml>=0.19.1",
]

[tool.ruff]
line-length = 120

[project.scripts]
programming-competition-creator = "programming_competition_creator.cli:main"
progcc = "programming_competition_creator.cli:main"

[build-system]
requires = ["uv_build>=0.9.23,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.40.0",
]

[tool.uv.build-backend]
data = ["src/programming_competition_creator/data"]

[tool.poe.tasks]
e2e-test.shell = """
set -e
rm -rf test-workdir
mkdir test-workdir
cd test-workdir
uv run progcc init
uv run progcc scaffold
uv run progcc build
uv run progcc test
"""
